[package]
name = "aws-sign-v4"
version = "0.3.0"
description = "Generate AWS Signature 4 headers easily"
repository = "https://github.com/psnszsn/aws-sign-v4"
keywords = ["AWS", "Signature"]
license = "BSD-2-Clause"
readme = "README.md"
authors = ["Vlad Pănăzan <brgdvz@gmail.com>", "Ken Shih <ken.shih@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
std = ["dep:http", "hex/std", "http?/std", "jiff/std", "ring/std", "url", "url/std"]
url = ["dep:url"]

[dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
http = { version = "1.4", default-features = false, optional = true }
jiff = { version = "0.2", default-features = false, features = ["alloc"] }
ring = { version = "0.17", default-features = false, features = ["alloc"] }
url = { version = "2.5", default-features = false, optional = true }
